<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图标一览 · 七七三国杀</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1a120e; color: #e8d5b0; font-family: monospace; padding: 24px; min-height: 100vh; }
  .svg-i { display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em; }
  h1 { font-size: 18px; color: var(--gold); letter-spacing: 2px; margin-bottom: 6px; }
  p.tip { font-size: 12px; color: #8a7050; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; }
  .cell { background: #241811; border: 1px solid #4a3a20; border-radius: 8px; padding: 12px 6px; text-align: center; }
  .big { font-size: 34px; color: #e8c878; line-height: 1; }
  .name { font-size: 11px; color: #a08860; margin-top: 8px; word-break: break-all; }
  .suit { color: #e74c3c; }
  .sec { grid-column: 1 / -1; font-size: 12px; color: #8a7050; padding-top: 10px; border-top: 1px solid #2a1a10; }
</style>
</head>
<body>
<h1>图标一览</h1>
<p class="tip">全部 46 个符号都由 js/ui/icons.js 的 ICON_STROKE / ICON_SUIT 生成，改这里即可，无需动 CSS。</p>
<div class="grid" id="g"></div>
<script src="../js/ui/icons.js"></script>
<script>
  const grid = document.getElementById('g');
  let html = '<div class="sec">界面 / 操作 / 状态</div>';
  html += Object.keys(ICON_STROKE)
    .map(n => `<div class="cell"><div class="big">${svgIcon(n)}</div><div class="name">${n}</div></div>`).join('');
  html += '<div class="sec">扑克花色（数据层仍是 ♠♥♣♦ 字符）</div>';
  const suitNames = { '♠': 'spade', '♥': 'heart', '♣': 'club', '♦': 'diamond' };
  html += Object.keys(suitNames)
    .map(s => `<div class="cell"><div class="big suit">${suitIcon(s)}</div><div class="name">${suitNames[s]}</div></div>`).join('');
  grid.innerHTML = html;
</script>
</body>
</html>
